<!-- Chatbot Floating Action Button -->
<button
  class="chatbot-fab"
  [class.active]="isOpen()"
  (click)="toggleChat()"
  [attr.aria-label]="isOpen() ? 'Cerrar asistente de chat' : 'Abrir asistente de chat'"
  [attr.aria-expanded]="isOpen()"
  aria-controls="vitta-chatbot-window"
  id="chatbot-toggle-btn"
>
  @if (!isOpen()) {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <span class="fab-badge" aria-hidden="true"></span>
  } @else {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  }
</button>

<!-- Chatbot Window -->
@if (isOpen()) {
  <div
    class="chatbot-window"
    id="vitta-chatbot-window"
    role="dialog"
    aria-label="Asistente Virtual Vitta Dulce"
  >
    <!-- Header -->
    <header class="chatbot-header">
      <div class="chatbot-profile">
        <div class="chatbot-avatar">🥑</div>
        <div class="chatbot-info">
          <h3>Vitta Bot</h3>
          <span class="status-indicator">En línea</span>
        </div>
      </div>
      <button
        class="chatbot-close-btn"
        (click)="toggleChat()"
        aria-label="Cerrar ventana de chat"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </header>

    <!-- Messages Container -->
    <div class="chatbot-messages" #messagesContainer>
      @for (msg of messages(); track $index) {
        <div class="message" [class.user]="msg.role === 'user'" [class.assistant]="msg.role === 'assistant'">
          <div class="message-content">
            {{ msg.content }}
          </div>
        </div>
      }

      @if (isLoading()) {
        <div class="message assistant">
          <div class="message-content typing-indicator" aria-label="Vitta Bot está escribiendo...">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      }
    </div>

    <!-- Input Footer -->
    <footer class="chatbot-input-area">
      <input
        type="text"
        placeholder="Escribe tu consulta aquí..."
        #chatInput
        (keydown.enter)="handleSend(chatInput)"
        aria-label="Mensaje para el chatbot"
        id="chatbot-message-input"
      />
      <button
        (click)="handleSend(chatInput)"
        aria-label="Enviar mensaje"
        [disabled]="isLoading() || !chatInput.value.trim()"
        class="chatbot-send-btn"
        id="chatbot-send-button"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </footer>
  </div>
}
